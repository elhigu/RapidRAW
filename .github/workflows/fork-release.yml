name: 'Fork release: Linux builds'

# This fork publishes Linux builds only. Upstream's release workflow is disabled on the fork.
# Draft releases don't trigger workflows, so a draft's assets are built by running this manually.
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release-id:
        description: 'ID of the (draft) release to upload to'
        required: true
        type: string
      tag:
        description: 'Tag to build'
        required: true
        type: string

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            asset-prefix: '03'
          - platform: 'ubuntu-22.04-arm'
            asset-prefix: '03'
          - platform: 'ubuntu-24.04'
            asset-prefix: '03'
          - platform: 'ubuntu-24.04-arm'
            asset-prefix: '03'
          - platform: 'ubuntu-22.04'
            args: '--features tethering'
            asset-prefix: '03_tethering'
          - platform: 'ubuntu-24.04'
            args: '--features tethering'
            asset-prefix: '03_tethering'
    uses: ./.github/workflows/build.yml
    with:
      release-id: ${{ inputs.release-id || github.event.release.id }}
      ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      platform: ${{ matrix.platform }}
      target: ''
      build-args: ${{ matrix.args }}
      asset-name-pattern: '[name]_v[version]_[platform]_[arch][ext]'
      asset-prefix: ${{ matrix.asset-prefix }}
    secrets: inherit
    permissions:
      contents: write
