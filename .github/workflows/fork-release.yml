name: 'Fork release: Linux builds'

# This fork publishes Linux builds only. Upstream's release workflow is disabled on the fork.
on:
  release:
    types: [created]

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            asset-prefix: '03'
          - platform: 'ubuntu-22.04-arm'
            asset-prefix: '03'
          - platform: 'ubuntu-24.04'
            asset-prefix: '03'
          - platform: 'ubuntu-24.04-arm'
            asset-prefix: '03'
          - platform: 'ubuntu-22.04'
            args: '--features tethering'
            asset-prefix: '03_tethering'
          - platform: 'ubuntu-24.04'
            args: '--features tethering'
            asset-prefix: '03_tethering'
    uses: ./.github/workflows/build.yml
    with:
      release-id: ${{ github.event.release.id }}
      platform: ${{ matrix.platform }}
      target: ''
      build-args: ${{ matrix.args }}
      asset-name-pattern: '[name]_v[version]_[platform]_[arch][ext]'
      asset-prefix: ${{ matrix.asset-prefix }}
    secrets: inherit
    permissions:
      contents: write
